
services:
  kafka:
    image: apache/kafka:latest
    container_name: kafka-tcc
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:29092,PLAINTEXT_HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:29092,PLAINTEXT_HOST://${KAFKA_HOST:-localhost}:9092"
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  jobmanager:
    image: flink:1.20
    container_name: flink-jobmanager-tcc
    volumes:
      - ./Flink/connectors/flink-sql-connector-kafka-3.4.0-1.20.jar:/opt/flink/lib/flink-sql-connector-kafka-3.4.0-1.20.jar:ro
      - ./Flink/connectors/flink-connector-jdbc-3.4.0-1.20.jar:/opt/flink/lib/flink-connector-jdbc-3.4.0-1.20.jar:ro
      - ./Flink/connectors/postgresql-42.7.4.jar:/opt/flink/lib/postgresql-42.7.4.jar:ro
    ports:
      - "8081:8081"
    command: jobmanager
    depends_on:
      - kafka
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager

  taskmanager:
    image: flink:1.20
    container_name: flink-taskmanager-tcc
    volumes:
      - ./Flink/connectors/flink-sql-connector-kafka-3.4.0-1.20.jar:/opt/flink/lib/flink-sql-connector-kafka-3.4.0-1.20.jar:ro
      - ./Flink/connectors/flink-connector-jdbc-3.4.0-1.20.jar:/opt/flink/lib/flink-connector-jdbc-3.4.0-1.20.jar:ro
      - ./Flink/connectors/postgresql-42.7.4.jar:/opt/flink/lib/postgresql-42.7.4.jar:ro
    depends_on:
      - jobmanager
    command: taskmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 4

  postgres:
    image: postgres:16-alpine
    container_name: postgres-resultados-tcc
    environment:
      POSTGRES_DB: tcc
      POSTGRES_USER: tcc
      POSTGRES_PASSWORD: ${TCC_PG_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - ./SQL/postgres_resultados.sql:/docker-entrypoint-initdb.d/01_resultados.sql:ro
      - postgres_tcc_data:/var/lib/postgresql/data

volumes:
  postgres_tcc_data:
